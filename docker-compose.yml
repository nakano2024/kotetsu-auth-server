version: '3.8'
services:
  app-build:
    build:
      dockerfile:  ./Dockerfile.build
    volumes:
      - app-store:/project
    environment:
      - DATASOURCE_URL=jdbc:postgresql://data/usermanager
      - DATASOURCE_USERNAME=webapp
      - DATASOURCE_PASSWORD=webapp
      - OIDC_PRIVATE_KEYS=${OIDC_PRIVATE_KEYS}
      - OIDC_PUBLIC_KEYS=${OIDC_PUBLIC_KEYS}
      - SERVER_URL=${SERVER_URL}

  app:
    build:
      dockerfile:  ./Dockerfile
    ports:
      - 8765:8000
    environment:
      - DATASOURCE_URL=jdbc:postgresql://data/usermanager
      - DATASOURCE_USERNAME=webapp
      - DATASOURCE_PASSWORD=webapp
      - OIDC_PRIVATE_KEYS=${OIDC_PRIVATE_KEYS}
      - OIDC_PUBLIC_KEYS=${OIDC_PUBLIC_KEYS}
      - SERVER_URL=${SERVER_URL}

  # app-dev:
  #   build:
  #     dockerfile:  ./Dockerfile.dev
  #   volumes:
  #     - app-store:/project
  #   ports:
  #     - 8765:8000
  #   environment:
  #     - DATASOURCE_URL=jdbc:postgresql://data/usermanager
  #     - DATASOURCE_USERNAME=webapp
  #     - DATASOURCE_PASSWORD=webapp
  #     - OIDC_PRIVATE_KEYS=${OIDC_PRIVATE_KEYS}
  #     - OIDC_PUBLIC_KEYS=${OIDC_PUBLIC_KEYS}
  #     - SERVER_URL=${SERVER_URL}
  #   tty: true
  #   command: sleep infinity
  
  data:
    image: postgres:14
    volumes:
      - db-store:/var/lib/postgresql/data
    ports:
      - 6432:5432
    environment:
      - POSTGRES_DB=usermanager
      - POSTGRES_USER=webapp
      - POSTGRES_PASSWORD=webapp
    tty: true

  data-testing:
    image: postgres:14
    volumes:
      - db-testing-store:/var/lib/postgresql/data
    ports:
      - 6433:5432
    environment:
      - POSTGRES_DB=usermanager
      - POSTGRES_USER=webapp
      - POSTGRES_PASSWORD=webapp
    tty: true

  client:
    build:
      dockerfile:  ./Dockerfile.client
    volumes:
      - client-store:/app  
    ports:
      - 3001:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  client-redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --save 60 1000
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"      # ブラウザUI: http://localhost:5540
    depends_on:
      client-redis:
        condition: service_healthy

volumes:
  app-store:
    driver: local
    driver_opts:
      type: none
      device: ./project
      o: bind
  client-store:
    driver: local
    driver_opts:
      type: none
      device: ./client
      o: bind
  db-store:
  db-testing-store:
  redis-data: